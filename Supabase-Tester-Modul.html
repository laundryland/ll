  alamat text,
  kota text,
  status text default 'aktif',

-- 3. Tabel Pelanggan
create table if not exists pelanggan (
  id uuid primary key default gen_random_uuid(),
  nama text not null,
  hp text,
  alamat text,
  outlet_id uuid references outlet(id) on delete set null,
  created_at timestamptz default now()
);

-- 4. Tabel Pegawai

  id uuid primary key default gen_random_uuid(),
  nama text not null,
  jabatan text,
  outlet_id uuid references outlet(id) on delete set null,
  hp text,
  status text default 'aktif',
  created_at timestamptz default now()
);

-- 5. Tabel Deposito

  id uuid primary key default gen_random_uuid(),
  pelanggan_id uuid references pelanggan(id) on delete cascade,
  jumlah numeric default 0,
  tenor int default 12,
  bunga numeric default 5,
  tanggal date default current_date,
  created_at timestamptz default now()
);

-- 6. Tabel Nota
create table if not exists nota (
  id uuid primary key default gen_random_uuid(),
  pelanggan_id uuid references pelanggan(id) on delete set null,
  outlet_id uuid references outlet(id) on delete set null,
  total numeric default 0,
  metode_bayar text default 'cash',
  keterangan text,
  created_at timestamptz default now()
);
